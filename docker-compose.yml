name: sage

services:
  sage:
    image: ghcr.io/v31-dev/sage:${SAGE_IMAGE_TAG:?Set SAGE_IMAGE_TAG to a full version such as 0.0.2}
    container_name: sage
    restart: unless-stopped
    # Allow attaching live profilers (py-spy, memray) via `docker exec`.
    cap_add: ["SYS_PTRACE"]
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - DOMAIN=${DOMAIN}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
      - WORKER_TAILSCALE_TAG=worker
      - HOSTNAME=${HOSTNAME}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_PATH=${S3_PATH}
    volumes:
      - ${SAGE_HOME}/sage:/app/data
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${TS_IP}:443:443
      - ${TS_IP}:9001:9001
    dns:
      - 100.100.100.100
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9000/api\").getcode() == 200 or exit(1)'"]
      start_period: 10s
