# Local development stack: the manager built from source, the Vite dev server, and a dev
# Traefik that serves both at https://<TS_NAME>.core.<DOMAIN>.
# Deploying the published image is described in the README.
name: sage

services:
  sage:
    build:
      context: app
      dockerfile: Dockerfile
      args:
        ENV: development
    container_name: sage
    environment:
      - TS_AUTH_KEY=${TS_AUTH_KEY:?Set TS_AUTH_KEY to a tagged, non-ephemeral Tailscale auth key}
      - TS_NAME=${TS_NAME:?Set TS_NAME to the manager's tailnet machine name}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (openssl rand -base64 32 | tr '+/' '-_')}
      - TS_WORKER_TAG=${TS_WORKER_TAG:?Set TS_WORKER_TAG to the dev workers' Tailscale tag}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID}
      - DOMAIN=${DOMAIN:?Set DOMAIN to the dev Cloudflare domain}
      - ENV=development
      # The dev Traefik owns :80/:443 and routes /api here.
      - PORT=9000
    volumes:
      - ${SAGE_DATA:?Set SAGE_DATA to the host directory for the manager's data}:/app/data
    # Fail fast in dev: a failed init (e.g. ACME) should stop, not restart-loop
    # and hammer Let's Encrypt rate limits.
    restart: "no"
    # Allow attaching live profilers (py-spy, memray) via `docker exec`.
    cap_add: ["SYS_PTRACE"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9000/api\").getcode() == 200 or exit(1)'"]
      # Sage answers only once its certificate is issued, which can take minutes on a
      # first start; failures during start_period don't count.
      start_period: 5m
      interval: 10s
      retries: 6
    # debugpy is reached over the tailnet at <TS_NAME>:5678 (no host port).
    command: python -m debugpy --listen 0.0.0.0:5678 main.py
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Vite dev server with HMR, reached through the dev Traefik.
  ui:
    build:
      context: ui
      dockerfile: Dockerfile
    container_name: ui
    develop:
      watch:
        - path: ./ui/src
          target: /app/src
          action: sync
    depends_on:
      sage:
        condition: service_healthy

  # Serves https://<TS_NAME>.core.<DOMAIN> with the manager's certificate:
  # /api to the manager, everything else (incl. the HMR WebSocket) to Vite.
  traefik:
    image: traefik:v3.6.7
    container_name: sage-dev-traefik
    network_mode: service:sage
    environment:
      - TS_NAME=${TS_NAME}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./dev/traefik:/etc/traefik:ro
      - ${SAGE_DATA}/certs/manager:/certs:ro
    depends_on:
      sage:
        condition: service_healthy
        # A namespace-sharing container loses its network when sage restarts.
        restart: true
      ui:
        condition: service_started
