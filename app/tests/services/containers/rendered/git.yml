name: sage-2222222222222222

services:
  sage-2222222222222222:
    build:
      context: https://github.com/user/api.git#main
      dockerfile: docker/Dockerfile
      args: [ "VERSION=1.2", "QUOTED=x y" ]
      secrets: [ NPM_TOKEN, OTHER ]
    container_name: sage-2222222222222222
    cgroup_parent: sage-apps.slice
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      sage.instance: "1234567e89012345"
      sage.generation: "0000000000000123"
      sage.container: "2222222222222222"
      sage.deployment: "5555555555555e55"
      sage.application: "shop-api"
    restart: unless-stopped
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    command: 
    volumes: [  ]
    env_file: .env
    networks:
      - default

# Its own network, which only Traefik joins beside it; kept while Traefik is attached to it.
networks:
  default:
    name: sage-2222222222222222
    driver_opts:
      com.docker.network.bridge.name: sage22222222222
    labels:
      sage.container: "2222222222222222"

secrets:
  NPM_TOKEN:
    file: ./secrets/NPM_TOKEN
  OTHER:
    file: ./secrets/OTHER
