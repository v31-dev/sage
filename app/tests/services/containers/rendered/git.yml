name: sage-2222222222222222

services:
  sage-2222222222222222:
    build:
      context: https://github.com/user/api.git#main
      dockerfile: docker/Dockerfile
      args: [ "VERSION=1.2", "QUOTED=x y" ]
      secrets: [ NPM_TOKEN, OTHER ]
    container_name: sage-2222222222222222
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
