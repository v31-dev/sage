api:
  insecure: true

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  websecure:
    address: :443

certificatesResolvers:
  cloudflare:
    acme:
      email: ${ADMIN_EMAIL}
      storage: /etc/traefik/acme.json
      dnsChallenge:
        provider: cloudflare