data_dir: /var/lib/vector

sources:
  container_logs:
    type: docker_logs
    include_containers:
      - "sage"

sinks:
  fastapi_http:
    type: http
    inputs: ["container_logs"]
    uri: "http://${IP}:9001/api/vector/logs"
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_events: 100
      timeout_secs: 5
    buffer:
      type: disk
      max_size: 536870912
      when_full: block
    request:
      concurrency: 1
      retry_attempts: 2147483647
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 60
      headers:
        X-Node-Name: "${HOSTNAME}"