# Managed by the Sage manager, which renders this file. Changes made here are overwritten
# on the next sync.

[agent]
  interval = "${INTERVAL}s"
  round_interval = true
  metric_batch_size = 10000
  metric_buffer_limit = 10000
  flush_interval = "${INTERVAL}s"
  omit_hostname = true
  skip_processors_after_aggregators = true

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  fieldinclude = ["usage_idle"]

[[inputs.mem]]
  fieldinclude = ["total", "used", "cached", "available"]

[[inputs.system]]
  fieldinclude = ["load1", "load5", "load15", "n_cpus"]

# The filesystem of this directory, which is on the worker's root disk.
[[inputs.disk]]
  mount_points = ["/etc/telegraf"]
  fieldinclude = ["total", "used"]

# The physical interfaces only, so bridges and the containers' veth pairs are not counted twice.
[[inputs.net]]
  interfaces = ["eth*", "en*"]
  fieldinclude = ["bytes_recv", "bytes_sent"]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]
  perdevice_include = []
  total_include = ["cpu", "network"]
  docker_label_include = ["sage.deployed_at"]
  fieldinclude = ["oomkilled", "exitcode", "started_at", "finished_at", "health_status",
                  "failing_streak", "usage", "usage_percent", "rx_bytes", "tx_bytes"]

# Whether Traefik accepts connections on the worker's tailnet address.
[[inputs.net_response]]
  protocol = "tcp"
  address = "${TS_IP}:443"
  timeout = "2s"

[[outputs.http]]
  url = "http://${IP}:9001/api/telegraf/report"
  method = "POST"
  data_format = "json"
  json_timestamp_units = "1ms"
  content_encoding = "gzip"
  timeout = "5s"
  [outputs.http.headers]
    Content-Type = "application/json"
    X-Node-Name = "${HOSTNAME}"
