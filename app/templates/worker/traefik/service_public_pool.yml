http:
  routers:
    # Entrypoint via Cloudflare Tunnel
    ${SERVICE}_${SUBDOMAIN}_public_${POOL_TAG}:
      rule: Host(`${SUBDOMAIN}.${DOMAIN}`) && PathPrefix(`/`) && Query(`x-tag`, `${POOL_TAG}`)
      entrypoints:
        - web
      middlewares:
        - security-headers
        - mark-as-hopped
      priority: 300
      service: ${SERVICE}_${SUBDOMAIN}_public_${POOL_TAG}

  services:
    # Loadbalanced pool services
    ${SERVICE}_${SUBDOMAIN}_public_${POOL_TAG}:
      loadBalancer:
        servers: [ ${LOAD_BALANCED_SERVERS} ]