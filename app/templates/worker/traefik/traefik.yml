accessLog:
  format: json
  filePath: /dev/stdout

ping:
  manualRouting: true

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  web:
    address: :80
    forwardedHeaders:
      # The tunnels' network, which only they and Traefik join: the client address they forward is taken from them alone.
      trustedIPs: ${EDGE_SUBNETS}
  # Internal HTTPS client entry via Tailscale (the *.int domains); TLS terminated here.
  websecure:
    address: :443
  # TCP backing services (redis/postgres/...), routed by SNI on one shared port.
  tcps:
    address: :8443