http:
  routers:
    domain_${ID}:
      rule: Host(`${HOST}`)
      entrypoints:
        - websecure
      middlewares:
        - security-headers
        - tailscale-only
      service: domain_${ID}
      tls: {}
    # The probe a client times to choose a name, answered by Traefik; HEAD only, so the application's own GET /ping
    # still reaches it.
    domain_${ID}_ping:
      rule: Host(`${HOST}`) && Method(`HEAD`) && Path(`/ping`)
      priority: 1000
      entrypoints:
        - websecure
      middlewares:
        - tailscale-only
        - probe
      service: ping@internal
      tls: {}

  services:
    domain_${ID}:
      loadBalancer:
        servers:
          - url: http://${SERVICE}:${PORT}
