http:
  routers:
    ${SERVICE}_${NAME}_internal:
      rule: Host(`${HOST}`)
      entrypoints:
        - websecure
      middlewares:
        - security-headers
        - tailscale-only
        - server-header
      service: ${SERVICE}_${NAME}_internal
      tls: {}
    # The probe a client times to choose a name, answered by Traefik; HEAD only, so the application's own GET /ping
    # still reaches it.
    ${SERVICE}_${NAME}_internal_ping:
      rule: Host(`${HOST}`) && Method(`HEAD`) && Path(`/ping`)
      priority: 1000
      entrypoints:
        - websecure
      middlewares:
        - tailscale-only
        - probe
        - server-header
      service: ping@internal
      tls: {}

  services:
    ${SERVICE}_${NAME}_internal:
      loadBalancer:
        servers:
          - url: http://${SERVICE}:${PORT}
