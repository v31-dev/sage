http:
  middlewares:
    tailscale-only:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"
          - "172.16.0.0/12"
    # Lets a page on another origin time the probe of a name.
    probe:
      headers:
        customResponseHeaders:
          Timing-Allow-Origin: "*"
          Access-Control-Allow-Origin: "*"
          Cache-Control: "no-store"

tcp:
  middlewares:
    tailscale-only-tcp:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"
          - "172.16.0.0/12"

# TLS options for the TCP routers, which terminate TLS
tls:
  options:
    backend-tcp:
      alpnProtocols:
        - postgresql
        - h2
        - http/1.1
