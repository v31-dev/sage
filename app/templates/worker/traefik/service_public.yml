# sage-domain ${ID} ${FINGERPRINT}
http:
  routers:
    domain_${ID}:
      rule: Host(`${HOST}`)
      entrypoints:
        - web
      middlewares:
        - security-headers
        - domain_${ID}_cors
      service: domain_${ID}
    # The probe a client times to choose a name, answered by Traefik; HEAD only, so the application's own GET /ping
    # still reaches it.
    domain_${ID}_ping:
      rule: Host(`${HOST}`) && Method(`HEAD`) && Path(`/ping`)
      priority: 1000
      entrypoints:
        - web
      middlewares:
        - probe
      service: ping@internal

  middlewares:
    domain_${ID}_cors:
      headers:
        customResponseHeaders:
          Access-Control-Allow-Origin: ""
        accessControlAllowOriginList: ${CORS_ORIGINS}
        accessControlAllowMethods:
          - "*"
        accessControlAllowHeaders:
          - "*"
          - Authorization
        accessControlMaxAge: 300
        addVaryHeader: true

  services:
    domain_${ID}:
      loadBalancer:
        servers:
          - url: http://${SERVICE}:${PORT}
