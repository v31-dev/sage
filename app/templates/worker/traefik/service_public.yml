http:
  routers:
    ${SERVICE}_${NAME}_public:
      rule: Host(`${HOST}`)
      entrypoints:
        - web
      middlewares:
        - security-headers
      service: ${SERVICE}_${NAME}_public
    # The probe a client times to choose a name, answered by Traefik; HEAD only, so the application's own GET /ping
    # still reaches it.
    ${SERVICE}_${NAME}_public_ping:
      rule: Host(`${HOST}`) && Method(`HEAD`) && Path(`/ping`)
      priority: 1000
      entrypoints:
        - web
      middlewares:
        - probe
      service: ping@internal

  services:
    ${SERVICE}_${NAME}_public:
      loadBalancer:
        servers:
          - url: http://${SERVICE}:${PORT}
