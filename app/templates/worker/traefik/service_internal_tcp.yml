tcp:
  routers:
    # Routed by the SNI in the client's TLS ClientHello; TLS ends here with the workers' certificate (Traefik handles
    # Postgres STARTTLS, so libpq with sslmode=require works without sslnegotiation=direct).
    domain_${ID}:
      rule: HostSNI(`${HOST}`)
      entryPoints:
        - tcps
      middlewares:
        - tailscale-only-tcp
      service: domain_${ID}
      tls:
        options: backend-tcp

  services:
    domain_${ID}:
      loadBalancer:
        servers:
          - address: "${SERVICE}:${PORT}"
