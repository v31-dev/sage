name: ${RUNTIME_NAME}

services:
  ${RUNTIME_NAME}:
    image: ${IMAGE}
    pull_policy: always
    container_name: ${RUNTIME_NAME}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      sage.instance: "${INSTANCE_ID}"
      sage.generation: "${STATE_GENERATION}"
      sage.container: "${CONTAINER_ID}"
      sage.deployment: "${DEPLOYMENT_ID}"
      sage.application: "${APPLICATION}"
    restart: unless-stopped
    command: ${COMMAND}
    volumes: [ ${VOLUMES} ]
    env_file: .env
    networks:
      - sage_default

networks:
  sage_default:
    external: true