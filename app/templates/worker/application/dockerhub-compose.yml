services:
  ${CONTAINER_NAME}:
    image: ${IMAGE}
    container_name: ${CONTAINER_NAME}
    labels:
      sage.deployed_at: "${DEPLOYED_AT}"
    restart: unless-stopped
    command: ${COMMAND}
    volumes: [ ${VOLUMES} ]
    env_file: .env
    networks:
      - sage_default

networks:
  sage_default:
    external: true