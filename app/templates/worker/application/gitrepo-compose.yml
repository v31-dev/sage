name: ${RUNTIME_NAME}

services:
  ${RUNTIME_NAME}:
    build:
      context: ${REPO}
      dockerfile: ${DOCKERFILE}
      args: [ ${BUILD_ARGS} ]
      secrets: [ ${BUILD_SECRETS} ]
    container_name: ${RUNTIME_NAME}
    cgroup_parent: ${APPLICATIONS_SLICE}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      sage.instance: "${INSTANCE_ID}"
      sage.generation: "${STATE_GENERATION}"
      sage.container: "${CONTAINER_ID}"
      sage.deployment: "${DEPLOYMENT_ID}"
      sage.application: "${APPLICATION}"
    restart: unless-stopped
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    command: ${COMMAND}
    volumes: [ ${VOLUMES} ]
    env_file: .env
    networks:
      - default

# Its own network, which only Traefik joins beside it; kept while Traefik is attached to it.
networks:
  default:
    name: ${RUNTIME_NAME}
    driver_opts:
      com.docker.network.bridge.name: ${BRIDGE_NAME}
    labels:
      sage.container: "${CONTAINER_ID}"

${SECRETS_BLOCK}
