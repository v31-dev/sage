# Managed by the Sage manager, which renders this file and starts its services. Changes
# made here are overwritten on the next sync.
name: sage

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  traefik:
    image: traefik:v3.6.7
    container_name: traefik
    logging: *logging
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${SAGE_HOME}/traefik:/etc/traefik
    dns:
      - 100.100.100.100
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - ${TS_IP}:80:80
      - ${TS_IP}:443:443
      - ${TS_IP}:9002:9002
      - ${TS_IP}:8443:8443
      - ${TS_IP}:9003:9003
    command:
      - "--configFile=/etc/traefik/traefik.yml"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    logging: *logging
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run

  vector:
    image: timberio/vector:0.54.0-alpine
    container_name: vector
    logging: *logging
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${SAGE_HOME}/vector/config:/etc/vector:ro
      - ${SAGE_HOME}/vector/buffer:/var/lib/vector
    command:
      - "--config-yaml"
      - "/etc/vector/vector.yml"
      - "--watch-config"
      - "--watch-config-method"
      - "poll"
    dns:
      - 100.100.100.100
      - 1.1.1.1
      - 8.8.8.8

  telegraf:
    image: telegraf:1.40.2-alpine
    container_name: telegraf
    logging: *logging
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    network_mode: host
    user: telegraf:${DOCKER_GID}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${SAGE_HOME}/telegraf:/etc/telegraf:ro

networks:
  default:
    name: sage_default