name: PR Check

on:
  pull_request:
    types:
      - ready_for_review
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-metadata:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Validate PR Metadata
    steps:
      - name: Validate PR Metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          body = (os.environ.get("PR_BODY") or "").strip()
          labels = json.loads(os.environ.get("PR_LABELS") or "[]")

          if not body:
            print("❌ PR description is required")

          if not labels:
            print("❌ PR must have at least one label")

          if not body or not labels:
            sys.exit(1)

          print("✅ PR description is present")
          print("✅ PR has at least one label")
          PY

  success:
    if: github.event.pull_request.draft == false && always()
    runs-on: ubuntu-latest
    name: PR Check Complete
    needs:
      - validate-pr-metadata
    steps:
      - name: Check dependency status
        run: |
          if [[ "${{ needs.validate-pr-metadata.result }}" != "success" ]]; then
            echo "❌ PR metadata validation failed. Cannot merge."
            exit 1
          fi

          echo "✅ All checks passed."
