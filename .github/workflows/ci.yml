name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Lint
        run: ruff check

      - name: Import order
        run: isort --check-only .

      - name: Format check
        run: autopep8 --diff --recursive --exit-code .

      - name: Test
        run: pytest -q --cov-report=term --cov-report=xml

      - name: Coverage summary
        run: |
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: app/coverage.xml

  ui:
    name: UI
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Type-check the tests
        run: npm run typecheck:tests

      - name: Test
        run: npm test

      - name: Coverage summary
        run: |
          {
            echo "### UI coverage"
            echo
            echo "| | Covered | Total | % |"
            echo "|---|---:|---:|---:|"
            node -e '
              const { total } = JSON.parse(require("fs").readFileSync("coverage/coverage-summary.json", "utf8"))
              for (const key of ["statements", "branches", "functions", "lines"]) {
                console.log(`| ${key} | ${total[key].covered} | ${total[key].total} | ${total[key].pct}% |`)
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-coverage
          path: ui/coverage
