name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'ui/**'
      - 'VERSION'
      - 'Dockerfile'
      - '.github/workflows/publish.yml'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MAJOR_MINOR=$(echo $VERSION | cut -d. -f1-2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (major: $MAJOR, major.minor: $MAJOR_MINOR)"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag, or use first commit if no tags exist
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CURRENT_COMMIT=$(git rev-parse HEAD)
          
          echo "Previous tag: $PREVIOUS_TAG"
          echo "Current commit: $CURRENT_COMMIT"
          
          # Generate changelog from commits
          CHANGELOG=$(git log $PREVIOUS_TAG..$CURRENT_COMMIT --oneline --graph --pretty=format:"%h - %s (%an, %ar)" 2>/dev/null || git log --oneline --graph --pretty=format:"%h - %s (%an, %ar)")
          
          # Handle multiline output
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/v31-dev/sage:latest
            ghcr.io/v31-dev/sage:${{ steps.version.outputs.version }}
            ghcr.io/v31-dev/sage:${{ steps.version.outputs.major_minor }}
            ghcr.io/v31-dev/sage:${{ steps.version.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/v31-dev/sage
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            ## 📦 Docker Image
            
            Published to: `ghcr.io/v31-dev/sage:${{ steps.version.outputs.version }}`
            
            Pull with:
            ```bash
            docker pull ghcr.io/v31-dev/sage:latest
            docker pull ghcr.io/v31-dev/sage:${{ steps.version.outputs.version }}
            docker pull ghcr.io/v31-dev/sage:${{ steps.version.outputs.major_minor }}
            ```
            
            ## 📝 Changelog
            
            ```
            ${{ steps.changelog.outputs.changelog }}
            ```
          draft: false
          prerelease: false
