name: Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'sample.env'

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version_path = Path("VERSION")
          version = version_path.read_text().strip()
          match = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version)
          if not match:
              print("VERSION must use full semantic version format: MAJOR.MINOR.PATCH")
              print(f"Found: {version}")
              sys.exit(1)

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")

          print(f"Version: {version}")
          PY

      - name: Validate merged release PR
        id: release_pr
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            const { owner, repo } = context.repo;
            const expectedTitle = `v${version}`;
            const isMatchingReleasePr = (pr) =>
              pr &&
              pr.base?.ref === 'main' &&
              pr.merged_at &&
              pr.title === expectedTitle;

            let prs = [];
            try {
              prs = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: context.sha,
                },
              );
            } catch (error) {
              core.warning(`Associated PR lookup failed for ${context.sha}: ${error.message}`);
            }

            let matchingPr = prs.find(isMatchingReleasePr);

            if (!matchingPr) {
              const commitMessage = context.payload.head_commit?.message || '';
              const prNumberMatch = commitMessage.match(/\(#(\d+)\)/);
              if (prNumberMatch) {
                const prNumber = Number(prNumberMatch[1]);
                core.info(`Falling back to PR #${prNumber} parsed from commit message.`);
                const { data: pullRequest } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });

                if (isMatchingReleasePr(pullRequest)) {
                  matchingPr = pullRequest;
                }
              }
            }

            if (!matchingPr) {
              core.setFailed(
                `No merged release PR with title "${expectedTitle}" is associated with commit ${context.sha}.`,
              );
              return;
            }

            core.info(`Publishing merged release PR #${matchingPr.number}: ${matchingPr.title}`);
            core.setOutput('number', String(matchingPr.number));
            core.setOutput('body', matchingPr.body || '');

      - name: Check release tag does not exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists: v$VERSION"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/v31-dev/sage:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/v31-dev/sage
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create GitHub release
        uses: actions/github-script@v9
        env:
          RELEASE_PR_BODY: ${{ steps.release_pr.outputs.body }}
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const tagName = `v${version}`;
            const image = `ghcr.io/v31-dev/sage:${version}`;
            const { owner, repo } = context.repo;
            const prBody = process.env.RELEASE_PR_BODY || '';

            const body = [
              '## Docker Image',
              '```bash',
              `docker pull ${image}`,
              '```',
              prBody,
            ].join('\n');

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tagName,
              target_commitish: context.sha,
              name: `Release ${version}`,
              body,
              draft: false,
              prerelease: false,
              generate_release_notes: false,
            });
