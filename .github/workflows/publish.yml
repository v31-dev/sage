name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'ui/**'
      - 'VERSION'
      - 'Dockerfile'
      - '.github/workflows/publish.yml'

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must use full semantic version format: MAJOR.MINOR.PATCH"
            echo "Found: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check release tag does not exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists: v$VERSION"
            exit 1
          fi

      - name: Find previous release tag
        id: previous_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREVIOUS_TAG=$(python3 - <<'PY'
          import os
          import re
          import subprocess

          current = tuple(int(part) for part in os.environ["VERSION"].split("."))
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"],
              text=True,
          ).splitlines()

          candidates = []
          for tag in tags:
              match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
              if not match:
                  continue
              version = tuple(int(part) for part in match.groups())
              if version < current:
                  candidates.append((version, tag))

          if candidates:
              print(max(candidates)[1])
          PY
          )
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Previous release tag: $PREVIOUS_TAG"
          else
            echo "No previous release tag found"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/v31-dev/sage:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/v31-dev/sage
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create GitHub release
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const tagName = `v${version}`;
            const previousTagName = '${{ steps.previous_tag.outputs.previous_tag }}';
            const image = `ghcr.io/v31-dev/sage:${version}`;
            const { owner, repo } = context.repo;

            const noteParams = {
              owner,
              repo,
              tag_name: tagName,
              target_commitish: context.sha,
            };
            if (previousTagName) {
              noteParams.previous_tag_name = previousTagName;
            }

            const notes = await github.rest.repos.generateReleaseNotes(noteParams);

            const body = [
              '## Docker Image',
              '```bash',
              `docker pull ${image}`,
              '```',
              notes.data.body,
            ].join('\n');

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tagName,
              target_commitish: context.sha,
              name: `Release ${version}`,
              body,
              draft: false,
              prerelease: false,
              generate_release_notes: false,
            });
